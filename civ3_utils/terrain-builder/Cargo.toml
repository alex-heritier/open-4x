[package]
name = "terrain-builder"
version = "0.1.0"
edition = "2024"
description = "Compiles a small set of terrain materials into Civ3-format 9x9 terrain transition sheets for open-4x"
publish = false

# Standalone on purpose: an offline asset tool, not part of the game's build.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.dev]
opt-level = 2
