[package]
name = "biq-import"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Converts a Civilization III scenario (.biq) map into an open-4x scenario: terrain, rivers, resources, improvements, nations, and cities."
publish = false

# An offline tool with its own workspace root. It reads Civ3 files through the `civ3-biq` parser
# of the reference project, so it stays out of the game's workspace: the game itself has no
# dependency on `open-civ3/`.
[workspace]

[dependencies]
civ3-biq = { path = "../../../open-civ3/civ3_utils/biq" }
fourx-sim = { path = "../../crates/sim" }
serde_json = { version = "1", features = ["preserve_order"] }
